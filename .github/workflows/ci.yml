name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches the JDK bundled with Android Studio, which local builds use.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper JAR.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assembleDebug

      # Runs the whole unit test suite, comparing screenshots with the goldens in app/src/test/screenshots.
      - name: Unit and screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
